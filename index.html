<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171b1f" />
    <title>Australian Optical Retail Network</title>
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="Store filters and results">
        <header class="brand-header">
          <div>
            <p class="eyebrow">Australian Optical</p>
            <h1>Retail network</h1>
          </div>
          <button class="icon-button" id="resetButton" type="button" title="Reset map and filters" aria-label="Reset map and filters">
            <i data-lucide="rotate-ccw"></i>
          </button>
        </header>

        <section class="network-strip" aria-label="Network totals">
          <strong id="visibleTotal">802</strong>
          <span>locations visible</span>
          <span class="freshness" id="freshnessLabel">Loading sources</span>
        </section>

        <section class="filters" aria-label="Map filters">
          <label class="search-field">
            <i data-lucide="search"></i>
            <span class="sr-only">Search stores, suburbs or postcodes</span>
            <input id="searchInput" type="search" placeholder="Store, suburb or postcode" autocomplete="off" />
          </label>

          <fieldset class="retailer-filter">
            <legend>Retailer</legend>
            <label class="retailer-option" data-retailer="OPSM">
              <input type="checkbox" value="OPSM" checked />
              <span class="marker-key marker-opsm"></span>
              <span>OPSM</span>
              <output id="opsmCount">335</output>
            </label>
            <label class="retailer-option" data-retailer="Specsavers">
              <input type="checkbox" value="Specsavers" checked />
              <span class="marker-key marker-specsavers"></span>
              <span>Specsavers</span>
              <output id="specsaversCount">399</output>
            </label>
            <label class="retailer-option" data-retailer="Bailey Nelson">
              <input type="checkbox" value="Bailey Nelson" checked />
              <span class="marker-key marker-bailey"></span>
              <span>Bailey Nelson</span>
              <output id="baileyCount">68</output>
            </label>
          </fieldset>

          <div class="select-grid">
            <label>
              <span>State</span>
              <select id="stateSelect"><option value="">All states</option></select>
            </label>
            <label>
              <span>Location</span>
              <select id="locationSelect">
                <option value="">All locations</option>
                <option>Shopping Centre</option>
                <option>Main Street / Street-front</option>
                <option>Other</option>
                <option>Unclassified</option>
              </select>
            </label>
            <label>
              <span>Audiology</span>
              <select id="audiologySelect">
                <option value="">Any</option>
                <option value="true">Available</option>
                <option value="false">Not listed</option>
              </select>
            </label>
            <label>
              <span>Status</span>
              <select id="statusSelect"><option value="">All statuses</option></select>
            </label>
          </div>

          <label class="service-field">
            <span>Service</span>
            <input id="serviceInput" type="search" placeholder="e.g. dry eye, contact lens" autocomplete="off" />
          </label>
        </section>

        <section class="result-section" aria-live="polite">
          <div class="section-heading">
            <h2>Locations</h2>
            <span id="resultCount">802 results</span>
          </div>
          <div class="store-list" id="storeList"></div>
        </section>
      </aside>

      <section class="map-workspace" aria-label="Interactive optical retail map">
        <div class="map-toolbar" role="toolbar" aria-label="Map tools">
          <button id="compareButton" type="button" title="Compare two stores">
            <i data-lucide="ruler"></i><span>Compare</span>
          </button>
          <button id="candidateButton" type="button" title="Analyse a proposed leasing site">
            <i data-lucide="map-pin-plus"></i><span>Candidate site</span>
          </button>
          <button id="summaryButton" type="button" title="View network summary">
            <i data-lucide="chart-no-axes-combined"></i><span>Summary</span>
          </button>
          <button id="downloadButton" type="button" title="Download filtered stores as CSV">
            <i data-lucide="download"></i><span>CSV</span>
          </button>
        </div>

        <div class="mode-notice" id="modeNotice" hidden></div>
        <div id="map" aria-label="Map of Australian optical stores"></div>

        <aside class="detail-panel" id="detailPanel" aria-label="Location details" aria-hidden="true">
          <button class="panel-close icon-button" id="panelClose" type="button" aria-label="Close details" title="Close details">
            <i data-lucide="x"></i>
          </button>
          <div id="detailContent"></div>
        </aside>

        <div class="compare-tray" id="compareTray" hidden>
          <div>
            <span class="tray-label">A</span>
            <strong id="compareA">Select first store</strong>
          </div>
          <i data-lucide="arrow-right"></i>
          <div>
            <span class="tray-label">B</span>
            <strong id="compareB">Select second store</strong>
          </div>
          <output id="compareDistance"></output>
          <button class="icon-button" id="clearCompare" type="button" title="Clear comparison" aria-label="Clear comparison">
            <i data-lucide="trash-2"></i>
          </button>
        </div>

        <div class="loading-state" id="loadingState">
          <span class="loading-mark"></span>
          <strong>Building optical network</strong>
        </div>
      </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
